name: Finance release-gate CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-release-gate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-destructive-checks:
    name: Non-destructive checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Validate manifests
        shell: bash
        run: |
          composer validate --working-dir=backend --strict --no-check-publish
          npm pkg get name

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Run frontend tests
        run: npm run test:frontend -- --run

      - name: Check TypeScript
        run: npm exec tsc -- --noEmit

      - name: Build production frontend
        run: npm run build

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/verify-finance-release-gate.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run non-destructive verifier preflight
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'finance-release-gate-preflight.json'
          ./scripts/verify-finance-release-gate.ps1 -Preflight -ReportPath $report
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.gate -ne 'non-destructive verifier preflight' -or $result.status -ne 'PASS') {
            throw 'Verifier preflight did not produce the expected PASS result.'
          }
